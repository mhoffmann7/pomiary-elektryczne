<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f4f99">
<meta name="description" content="Protokoły z pomiarów instalacji elektrycznej wg PN-HD 60364-6">
<title>Pomiary elektryczne</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app"><p style="padding:24px;color:#5b6675">Wczytywanie…</p></div>
<div id="modal-root"></div>
<script src="js/app.js"></script>
<script src="js/export.js"></script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
      document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') reg.update().catch(()=>{}); });
      reg.addEventListener('updatefound', ()=>{
        const nw=reg.installing; if(!nw) return;
        nw.addEventListener('statechange', ()=>{
          if(nw.state==='installed' && navigator.serviceWorker.controller && typeof toast==='function'){ if(typeof saveNow==='function') saveNow();
            toast('Wczytuję nową wersję…'); setTimeout(()=>location.reload(),1200); }
        });
      });
    }).catch(()=>{});
  });
}
</script>
</body>
</html>
